name: API contract compatibility

on:
  pull_request:
    paths:
      - "openapi/**"

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Compare API contracts
        run: node apps/cli/dist/index.js compare openapi/released.yaml openapi/candidate.yaml --format markdown --output contractguard-report.md --fail-on breaking
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contractguard-report
          path: contractguard-report.md
