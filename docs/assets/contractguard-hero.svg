<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ContractGuard OpenAPI compatibility report preview</title>
  <desc id="desc">A visual showing an OpenAPI baseline and candidate flowing into an explainable compatibility report and CI gate.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a18"/>
      <stop offset="0.58" stop-color="#0d2c28"/>
      <stop offset="1" stop-color="#123832"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#81e6c1"/>
      <stop offset="1" stop-color="#c6f3a9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020807" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <circle cx="1090" cy="-20" r="250" fill="#4ec7a1" opacity="0.09"/>
  <circle cx="60" cy="650" r="230" fill="#b8ee9d" opacity="0.06"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(72 62)">
      <rect width="42" height="42" rx="12" fill="url(#accent)"/>
      <path d="M12 21.5 18.5 28 31 14.5" fill="none" stroke="#09231f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="58" y="32" fill="#f4fbf8" font-size="31" font-weight="720">ContractGuard</text>
      <rect x="291" y="5" width="164" height="32" rx="16" fill="#153d37" stroke="#2f655a"/>
      <text x="373" y="27" text-anchor="middle" fill="#aee9d3" font-size="14" font-weight="650">OPENAPI 3.0 / 3.1</text>
    </g>

    <text x="72" y="174" fill="#f4fbf8" font-size="48" font-weight="760" letter-spacing="-1.5">Catch breaking API changes</text>
    <text x="72" y="226" fill="#f4fbf8" font-size="48" font-weight="760" letter-spacing="-1.5">before they reach clients.</text>
    <text x="72" y="271" fill="#9dc5bc" font-size="19">Deterministic findings, reviewable evidence, and a CI-ready exit code.</text>

    <g transform="translate(72 326)" filter="url(#shadow)">
      <rect width="300" height="104" rx="16" fill="#f4f7f3"/>
      <text x="24" y="32" fill="#668078" font-size="13" font-weight="700" letter-spacing="1.2">BASELINE</text>
      <text x="24" y="63" fill="#17352f" font-size="22" font-weight="720">petstore-v1.yaml</text>
      <text x="24" y="86" fill="#6e7e79" font-size="14">released contract</text>
      <rect x="220" y="22" width="56" height="28" rx="14" fill="#e4efe9"/>
      <text x="248" y="41" text-anchor="middle" fill="#346151" font-size="13" font-weight="700">3.0.3</text>
    </g>

    <path d="M389 378h46" stroke="#6ecfad" stroke-width="3" stroke-linecap="round"/>
    <path d="m428 370 9 8-9 8" fill="none" stroke="#6ecfad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(452 326)" filter="url(#shadow)">
      <rect width="300" height="104" rx="16" fill="#f4f7f3"/>
      <text x="24" y="32" fill="#668078" font-size="13" font-weight="700" letter-spacing="1.2">CANDIDATE</text>
      <text x="24" y="63" fill="#17352f" font-size="22" font-weight="720">petstore-v2.yaml</text>
      <text x="24" y="86" fill="#6e7e79" font-size="14">proposed contract</text>
      <rect x="220" y="22" width="56" height="28" rx="14" fill="#fff0dc"/>
      <text x="248" y="41" text-anchor="middle" fill="#8a5b21" font-size="13" font-weight="700">3.1.0</text>
    </g>

    <g transform="translate(790 136)" filter="url(#shadow)">
      <rect width="338" height="382" rx="20" fill="#f7f9f6"/>
      <rect width="338" height="64" rx="20" fill="#eef3ef"/>
      <rect y="44" width="338" height="20" fill="#eef3ef"/>
      <circle cx="26" cy="31" r="5" fill="#d1686f"/>
      <circle cx="45" cy="31" r="5" fill="#d4a34e"/>
      <circle cx="64" cy="31" r="5" fill="#62a783"/>
      <text x="92" y="37" fill="#526c64" font-size="15" font-weight="650">Compatibility report</text>

      <text x="24" y="108" fill="#17352f" font-size="15" font-weight="700">SCORE</text>
      <text x="24" y="157" fill="#b23c48" font-size="48" font-weight="780">0</text>
      <text x="55" y="157" fill="#789088" font-size="18">/ 100</text>
      <rect x="170" y="111" width="143" height="38" rx="19" fill="#fbe7e9"/>
      <text x="241.5" y="136" text-anchor="middle" fill="#a72f3c" font-size="14" font-weight="750">22 BREAKING</text>

      <line x1="24" y1="181" x2="314" y2="181" stroke="#d8e3dd"/>

      <g transform="translate(24 204)">
        <rect width="290" height="55" rx="11" fill="#fff" stroke="#dde6e1"/>
        <rect x="12" y="13" width="69" height="28" rx="14" fill="#fbe7e9"/>
        <text x="46.5" y="32" text-anchor="middle" fill="#a72f3c" font-size="11" font-weight="750">BREAKING</text>
        <text x="94" y="25" fill="#243f38" font-size="13" font-weight="700">Required parameter added</text>
        <text x="94" y="43" fill="#788b85" font-size="11">GET /pets · query.limit</text>
      </g>

      <g transform="translate(24 270)">
        <rect width="290" height="55" rx="11" fill="#fff" stroke="#dde6e1"/>
        <rect x="12" y="13" width="69" height="28" rx="14" fill="#fbe7e9"/>
        <text x="46.5" y="32" text-anchor="middle" fill="#a72f3c" font-size="11" font-weight="750">BREAKING</text>
        <text x="94" y="25" fill="#243f38" font-size="13" font-weight="700">Response field removed</text>
        <text x="94" y="43" fill="#788b85" font-size="11">200 response · Pet.name</text>
      </g>

      <g transform="translate(24 342)">
        <rect width="290" height="30" rx="8" fill="#173d35"/>
        <circle cx="20" cy="15" r="5" fill="#8be1c1"/>
        <text x="34" y="20" fill="#dff8ef" font-size="12" font-weight="650">CI blocked · exit code 2</text>
      </g>
    </g>

    <g transform="translate(72 490)">
      <rect width="146" height="38" rx="19" fill="#153d37" stroke="#2f655a"/>
      <text x="73" y="25" text-anchor="middle" fill="#bcebd9" font-size="14" font-weight="650">Deterministic</text>
      <rect x="158" width="125" height="38" rx="19" fill="#153d37" stroke="#2f655a"/>
      <text x="220.5" y="25" text-anchor="middle" fill="#bcebd9" font-size="14" font-weight="650">Local-first</text>
      <rect x="295" width="112" height="38" rx="19" fill="#153d37" stroke="#2f655a"/>
      <text x="351" y="25" text-anchor="middle" fill="#bcebd9" font-size="14" font-weight="650">CI-ready</text>
      <rect x="419" width="176" height="38" rx="19" fill="#153d37" stroke="#2f655a"/>
      <text x="507" y="25" text-anchor="middle" fill="#bcebd9" font-size="14" font-weight="650">Optional DeepSeek</text>
    </g>

    <text x="72" y="580" fill="#729b90" font-size="14">Explainable OpenAPI compatibility checks for Web, CLI, and CI.</text>
  </g>
</svg>
